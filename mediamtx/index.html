<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant 2 Direct Web Matrix Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 20px;
        }
        h1 { text-align: center; color: #0288d1; }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .camera-card {
            background-color: #1e1e1e;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .video-container {
            width: 100%;
            height: 270px;
            background-color: #000;
            border-radius: 4px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <h1>Plant 2 - Direct Browser Video Stream Grid (Port 80)</h1>
    
    <div class="grid-container">
        <div class="camera-card">
            <h3>Camera P2 C3 (Matrix)</h3>
            <div class="video-container">
                <img src="http://admin:T#ta12345@10.10.25.10:80/mjpeg.cgi" alt="Camera Stream Loading... (Verify Network Connection)" />
            </div>
        </div>

        <div class="camera-card">
            <h3>Watch Tower P2 (ONVIF)</h3>
            <div class="video-container">
                <img src="http://service:Atluri$9009@10.10.25.204:80/onvif-media/media.amp?profile=profile_1_sub" alt="Camera Stream Loading... (Verify Network Connection)" />
            </div>
        </div>
    </div>

</body>
</html>
