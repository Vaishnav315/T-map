version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: tasl_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    command: redis-server --appendonly yes

  postgres:
    image: timescale/timescaledb:latest-pg14
    container_name: tasl_db
    environment:
      POSTGRES_USER: tasl_admin
      POSTGRES_PASSWORD: tasl_password
      POSTGRES_DB: sentinel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  celery_worker:
    build: .
    container_name: tasl_celery
    command: celery -A backend.tasks worker --loglevel=info --concurrency=2
    volumes:
      - .:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - postgres
    restart: always

volumes:
  redis_data:
  postgres_data:
